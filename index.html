<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clip 메인</title>
  <style>
    body {
      font-family: "Apple SD Gothic Neo", sans-serif;
      text-align: center;
      background: #fafafa;
      margin: 0;
      padding: 60px 20px;
    }
    h1 { font-size: 26px; margin-bottom: 30px; color: #1d9bf0; }
    .folders {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    .folder-btn {
      width: 200px;
      padding: 15px;
      background: #1d9bf0;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }
    .folder-btn:hover {
      background: #1a8cd8;
    }
  </style>
</head>
<body>
  <h1>📁 Clip 폴더 선택</h1>

  <div class="folders">
    <button class="folder-btn" onclick="openFolder('A')">A 폴더</button>
    <button class="folder-btn" onclick="openFolder('B')">B 폴더</button>
    <button class="folder-btn" onclick="openFolder('C')">C 폴더</button>
  </div>

  <script>
    function openFolder(name) {
      location.href = `gallery.html?folder=${name}`;
    }
  </script>
</body>
</html>
