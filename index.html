<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Clip 폴더 선택</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: "Apple SD Gothic Neo", sans-serif;
      background: #f6f6f9;
      text-align: center;
      padding: 40px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 30px;
    }
    .folder-btn {
      display: inline-block;
      margin: 10px;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      color: white;
      cursor: pointer;
    }
    .a { background: #4a90e2; }
    .b { background: #3eb489; }
    .c { background: #9b59b6; }
    .footer {
      margin-top: 50px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>📁 Clip 폴더 선택</h1>
  <button class="folder-btn a" onclick="openFolder('A')">A 폴더</button>
  <button class="folder-btn b" onclick="openFolder('B')">B 폴더</button>
  <button class="folder-btn c" onclick="openFolder('C')">C 폴더</button>

  <div class="footer">© 2025 Clip WebApp</div>

  <script>
    function openFolder(folder) {
      location.href = `gallery.html?folder=${folder}`;
    }
  </script>
</body>
</html>
