<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>내 X 폴더</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-4 bg-gray-100 text-gray-800">
  <h1 class="text-2xl font-bold mb-3">📁 내 트윗 폴더</h1>
  <div id="folders" class="flex gap-3"></div>

  <script>
  const folders = ["A","B","C"];
  const params = new URLSearchParams(window.location.search);
  const addLink = params.get("add");
  const folderParam = params.get("folder");

  // 1. 링크 추가 처리
  if(addLink && folderParam) {
    const saved = JSON.parse(localStorage.getItem("tweetAlbums")||"{}");
    if(!saved[folderParam]) saved[folderParam] = [];
    if(!saved[folderParam].includes(addLink)) saved[folderParam].push(addLink);
    localStorage.setItem("tweetAlbums", JSON.stringify(saved));
    alert(`폴더 ${folderParam}에 트윗을 추가했습니다!`);
  }

  // 2. 폴더 목록 출력
  const box = document.getElementById("folders");
  folders.forEach(f=>{
    const btn=document.createElement("a");
    btn.textContent=f;
    btn.href=`gallery.html?folder=${f}`;
    btn.className="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600";
    box.appendChild(btn);
  });
  </script>
</body>
</html>
