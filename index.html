<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clip Debug</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col items-center min-h-screen p-6">
  <h1 class="text-2xl font-bold mb-4">📎 Clip Debug</h1>

  <div class="flex gap-4 mb-6">
    <a href="gallery.html?folder=A" class="bg-blue-500 text-white px-4 py-2 rounded-lg shadow hover:bg-blue-600">A 폴더</a>
    <a href="gallery.html?folder=B" class="bg-green-500 text-white px-4 py-2 rounded-lg shadow hover:bg-green-600">B 폴더</a>
    <a href="gallery.html?folder=C" class="bg-purple-500 text-white px-4 py-2 rounded-lg shadow hover:bg-purple-600">C 폴더</a>
  </div>

  <pre id="debug" class="bg-white rounded-lg shadow p-4 w-full max-w-md text-xs overflow-auto"></pre>

  <script>
    function log(msg) {
      document.getElementById('debug').innerHTML += msg + "\n";
    }

    const params = new URLSearchParams(window.location.search);
    const tweetURL = params.get("add");
    const folder = params.get("folder");

    log("📥 add=" + tweetURL);
    log("📁 folder=" + folder);

    if (tweetURL && folder) {
      const key = `folder_${folder}`;
      let data = JSON.parse(localStorage.getItem(key) || "[]");
      log("💾 저장 전 데이터 (" + key + "): " + JSON.stringify(data));

      if (!data.includes(tweetURL)) {
        data.push(tweetURL);
        localStorage.setItem(key, JSON.stringify(data));
        log("✅ 저장 완료! (" + key + "): " + JSON.stringify(data));
        alert(`✅ 폴더 [${folder}]에 트윗을 추가했습니다!`);
      } else {
        log("⚠️ 이미 존재하는 트윗: " + tweetURL);
      }

      log("📦 전체 localStorage:");
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        log(`- ${k}: ${localStorage.getItem(k)}`);
      }
    } else {
      log("❌ URL 또는 폴더 파라미터 누락");
    }
  </script>
</body>
</html>
