<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clip 갤러리</title>
  <style>
    body {
      font-family: "Apple SD Gothic Neo", sans-serif;
      text-align: center;
      background: #fafafa;
      margin: 0;
      padding: 30px;
    }
    h1 {
      font-size: 22px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .fallback {
      font-size: 40px;
      color: #999;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    .back {
      margin-top: 20px;
      display: block;
      color: #7e57c2;
    }
  </style>
</head>
<body>
  <h1>📁 <span id="folderName"></span> 폴더</h1>
  <p id="countInfo"></p>
  <div id="gallery" class="grid"></div>
  <a href="index.html" class="back">← 폴더 선택으로 돌아가기</a>

  <script>
    async function loadGallery() {
      const urlParams = new URLSearchParams(window.location.search);
      const folder = urlParams.get("folder");
      document.getElementById("folderName").textContent = folder;

      const key = `folder_${folder}`;
      const data = JSON.parse(localStorage.getItem(key) || "[]");
      document.getElementById("countInfo").textContent = `트윗 ${data.length}개`;

      const gallery = document.getElementById("gallery");
      gallery.innerHTML = "";

      // X.com → Twitter.com 변환 함수
      const normalizeUrl = (url) =>
        url.replace("https://x.com/", "https://twitter.com/");

      for (const link of data) {
        const normalized = normalizeUrl(link);

        // 트윗 ID 추출
        const match = normalized.match(/status\/(\d+)/);
        const tweetId = match ? match[1] : null;

        const div = document.createElement("div");
        div.className = "thumb";

        if (!tweetId) {
          div.innerHTML = '<div class="fallback">🚫</div>';
          gallery.appendChild(div);
          continue;
        }

        try {
          // oEmbed API 호출
          const oembedUrl = `https://publish.twitter.com/oembed?url=${encodeURIComponent(normalized)}&omit_script=true`;
          const res = await fetch(oembedUrl);
          const data = await res.json();

          // 이미지 URL 추출 (첫 img 태그)
          const parser = new DOMParser();
          const doc = parser.parseFromString(data.html, "text/html");
          const img = doc.querySelector("img");

          if (img && img.src) {
            const imgEl = document.createElement("img");
            imgEl.src = img.src;
            const linkEl = document.createElement("a");
            linkEl.href = normalized;
            linkEl.target = "_blank";
            linkEl.appendChild(imgEl);
            div.appendChild(linkEl);
          } else {
            div.innerHTML = '<div class="fallback">❌</div>';
          }
        } catch (err) {
          console.error(err);
          div.innerHTML = '<div class="fallback">❌</div>';
        }

        gallery.appendChild(div);
      }
    }

    loadGallery();
  </script>
</body>
</html>
