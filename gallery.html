<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>📁 트윗 폴더 보기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h2 {
      margin-bottom: 8px;
    }
    .info {
      color: #555;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      padding: 10px;
      justify-items: center;
    }
    .tweet {
      width: 140px;
      height: 140px;
      border-radius: 12px;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s ease;
    }
    .tweet:hover {
      transform: scale(1.05);
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    a {
      color: #7c3aed;
      text-decoration: none;
    }
    .back {
      display: inline-block;
      margin-top: 20px;
      color: #7c3aed;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h2>📁 <span id="folderName"></span></h2>
  <div class="info">
    <b>key:</b> <span id="folderKey"></span><br>
    <span id="tweetCount"></span>
  </div>
  <div id="tweetGrid" class="grid">로딩 중...</div>
  <a href="index.html" class="back">← 폴더 선택으로 돌아가기</a>

  <script>
    // URL에서 folder 이름 추출
    const params = new URLSearchParams(window.location.search);
    const folderKey = params.get("folder");

    document.getElementById("folderName").textContent = folderKey ? folderKey.toUpperCase() : "폴더";
    document.getElementById("folderKey").textContent = folderKey;

    // 로컬스토리지에서 해당 폴더 데이터 불러오기
    const data = JSON.parse(localStorage.getItem("folder_" + folderKey) || "[]");
    document.getElementById("tweetCount").textContent = `개수: ${data.length}`;
    const grid = document.getElementById("tweetGrid");
    grid.innerHTML = "";

    // ✅ 트윗 URL → 썸네일 이미지 가져오기
    async function fetchThumbnail(url) {
      try {
        // oEmbed API 호출
        const apiUrl = `https://publish.twitter.com/oembed?url=${encodeURIComponent(url)}`;
        const res = await fetch(apiUrl);
        const json = await res.json();

        // html 내부에 이미지가 있을 경우 추출
        const match = json.html.match(/https:\/\/pbs\.twimg\.com\/media\/[A-Za-z0-9_-]+\.(jpg|png|jpeg)/);
        if (match) return match[0];
      } catch (e) {
        console.warn("❌ 썸네일 불러오기 실패:", url);
      }
      return "https://abs.twimg.com/icons/apple-touch-icon-192x192.png"; // 기본 트위터 아이콘
    }

    // 폴더 내 각 트윗 표시
    async function renderTweets() {
      for (const url of data) {
        const thumb = await fetchThumbnail(url);
        const div = document.createElement("a");
        div.href = url;
        div.target = "_blank";
        div.className = "tweet";
        div.innerHTML = `<img src="${thumb}" alt="tweet">`;
        grid.appendChild(div);
      }
    }

    renderTweets();
  </script>
</body>
</html>
