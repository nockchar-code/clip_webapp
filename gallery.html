<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Clip 갤러리</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: "Apple SD Gothic Neo", sans-serif;
      background: #f6f6f9;
      text-align: center;
      padding: 30px;
    }
    h1 {
      font-size: 26px;
      margin-bottom: 10px;
    }
    .info {
      color: #666;
      margin-bottom: 20px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      justify-items: center;
      margin-top: 10px;
    }
    .thumb {
      width: 100%;
      max-width: 200px;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      background: #eee;
      overflow: hidden;
      position: relative;
      transition: transform 0.2s;
    }
    .thumb:hover {
      transform: scale(1.05);
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
    }
    a.back {
      display: inline-block;
      margin-top: 30px;
      text-decoration: none;
      color: #7b3fe4;
      font-weight: bold;
    }
    .msg {
      color: #333;
      font-size: 15px;
      margin: 10px 0 20px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1 id="folderTitle">📁 폴더</h1>
  <div class="info" id="infoText"></div>
  <div class="msg" id="msg"></div>
  <div class="gallery" id="gallery"></div>
  <a class="back" href="index.html">← 폴더 선택으로 돌아가기</a>

  <script>
    const params = new URLSearchParams(location.search);
    const folder = params.get("folder") || "A";
    const addTweet = params.get("add");
    const addImage = params.get("img");

    const folderKey = `folder_${folder}`;
    const gallery = document.getElementById("gallery");
    const msg = document.getElementById("msg");
    const title = document.getElementById("folderTitle");
    const info = document.getElementById("infoText");

    title.textContent = `📁 ${folder} 폴더`;

    let data = JSON.parse(localStorage.getItem(folderKey) || "[]");

    // ✅ 새 항목 추가 (단축어를 통한 URL 호출 시)
    if (addTweet && addImage) {
      const exists = data.some(item => item.tweet === addTweet);
      if (!exists) {
        data.push({ tweet: addTweet, image: addImage });
        localStorage.setItem(folderKey, JSON.stringify(data));
        msg.textContent = "✅ 새 이미지가 추가되었습니다!";
      } else {
        msg.textContent = "⚠️ 이미 존재하는 항목입니다.";
      }
    }

    // ✅ 즉시 다시 로드하여 반영
    data = JSON.parse(localStorage.getItem(folderKey) || "[]");

    info.textContent = `트윗 ${data.length}개`;

    // ✅ 갤러리 표시
    if (data.length === 0) {
      gallery.innerHTML = `<p>📭 ${folder} 폴더에 이미지가 없습니다.</p>`;
    } else {
      gallery.innerHTML = "";
      data.forEach(item => {
        const div = document.createElement("div");
        div.className = "thumb";
        const img = document.createElement("img");
        img.src = item.image;
        img.onerror = () => img.src = "https://cdn-icons-png.flaticon.com/512/463/463612.png"; // ❌ fallback
        img.onclick = () => window.open(item.tweet, "_blank");
        div.appendChild(img);
        gallery.appendChild(div);
      });
    }
  </script>
</body>
</html>
