<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📁 트윗 이미지 갤러리</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #fafafa;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h2 {
      margin-top: 10px;
      color: #333;
    }
    .back {
      display: inline-block;
      margin-top: 15px;
      color: #7c3aed;
      text-decoration: none;
      font-weight: 500;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
      margin-top: 25px;
      padding: 0 10px;
    }
    .thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      background: #f3f3f3;
      box-shadow: 0 0 5px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .thumb:hover {
      transform: scale(1.04);
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumb span {
      color: #aaa;
      font-size: 22px;
    }
    #count {
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <h2 id="folderTitle">📁 폴더</h2>
  <p id="count"></p>
  <div id="gallery" class="grid"></div>
  <a href="index.html" class="back">← 폴더 선택으로 돌아가기</a>

  <script>
    async function loadGallery() {
      const params = new URLSearchParams(window.location.search);
      const folder = params.get("folder") || "A";
      const key = "folder_" + folder;
      const urls = JSON.parse(localStorage.getItem(key) || "[]");

      document.getElementById("folderTitle").textContent = `📁 폴더 ${folder}`;
      document.getElementById("count").textContent = `트윗 ${urls.length}개`;

      const gallery = document.getElementById("gallery");
      gallery.innerHTML = "";

      if (urls.length === 0) {
        gallery.innerHTML = "<p>아직 저장된 트윗이 없습니다.</p>";
        return;
      }

      for (const tweetUrl of urls) {
        const box = document.createElement("div");
        box.className = "thumb";
        box.innerHTML = "<span>⏳</span>";
        gallery.appendChild(box);

        try {
          // ✅ 트윗 페이지 HTML을 프록시로 가져와 <meta property="og:image"> 파싱
          const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(tweetUrl)}`);
          const data = await res.json();
          const html = data.contents;

          // og:image 메타 태그에서 이미지 URL 추출
          const match = html.match(/<meta property="og:image" content="([^"]+)"/);
          const imageUrl = match ? match[1] : null;

          if (imageUrl) {
            const img = document.createElement("img");
            img.src = imageUrl;
            box.innerHTML = "";
            box.appendChild(img);
          } else {
            box.innerHTML = "<span>🚫</span>";
          }

          // 클릭 시 트윗 새 탭에서 열기
          box.onclick = () => window.open(tweetUrl, "_blank");

        } catch (e) {
          console.error("이미지 불러오기 실패:", e);
          box.innerHTML = "<span>❌</span>";
        }
      }
    }

    loadGallery();
  </script>
</body>
</html>
