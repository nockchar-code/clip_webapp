<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery Debug</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6 flex flex-col items-center">
  <h1 id="folderTitle" class="text-2xl font-bold mb-4"></h1>
  <pre id="debug" class="bg-white rounded-lg shadow p-4 w-full max-w-md text-xs overflow-auto mb-6"></pre>
  <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 w-full max-w-4xl"></div>
  <a href="index.html" class="mt-6 text-blue-600 underline">← 폴더 선택으로 돌아가기</a>

  <script>
    function log(msg) {
      document.getElementById('debug').innerHTML += msg + "\n";
    }

    const params = new URLSearchParams(window.location.search);
    const folder = params.get("folder");
    document.getElementById("folderTitle").textContent = `📁 폴더 ${folder}`;

    const key = `folder_${folder}`;
    const data = JSON.parse(localStorage.getItem(key) || "[]");
    const gallery = document.getElementById("gallery");

    log("📦 key=" + key);
    log("📦 data=" + JSON.stringify(data));

    if (!data.length) {
      gallery.innerHTML = `<p class="text-gray-500 text-center col-span-3">아직 ${folder} 폴더에 저장된 트윗이 없습니다.</p>`;
    } else {
      data.forEach(url => {
        log("🔗 트윗 URL=" + url);
        const card = document.createElement("div");
        card.className = "p-4 bg-white rounded-lg shadow";
        card.innerHTML = `<a href="${url}" target="_blank" class="text-blue-600">${url}</a>`;
        gallery.appendChild(card);
      });
    }
  </script>
</body>
</html>
