<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Clip 갤러리</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: "Apple SD Gothic Neo", sans-serif;
      background: #f6f6f9;
      text-align: center;
      padding: 30px;
    }
    h1 { font-size: 26px; margin-bottom: 10px; }
    .info { color: #666; margin-bottom: 20px; }

    /* 기본 3열 */
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      justify-items: center;
      margin-top: 10px;
      transition: all 0.3s ease;
    }
    /* 1열 보기 시 */
    .gallery.one-column {
      grid-template-columns: repeat(1, 1fr);
    }

    .thumb {
      width: 100%;
      max-width: 200px;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.2s, max-width 0.3s;
      position: relative;
    }
    /* 1열 보기 시 이미지 확대 */
    .gallery.one-column .thumb {
      max-width: 360px;
    }

    .thumb:hover { transform: scale(1.03); }
    .thumb img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
      cursor: pointer;
      transition: height 0.3s ease;
    }
    
    .gallery.one-column .thumb img {
      height: auto;
      width: 100%;
      object-fit: contain; /* 비율 유지하며 잘리지 않게 표시 */
      aspect-ratio: auto;  /* 필요시 브라우저가 비율 맞춤 */
    }

    .del {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(255, 0, 0, 0.85);
      color: white;
      font-size: 14px;
      padding: 5px 0;
      border: none;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .thumb:hover .del { opacity: 1; }

    a.back {
      display: inline-block;
      margin-top: 30px;
      text-decoration: none;
      color: #7b3fe4;
      font-weight: bold;
    }

    .msg {
      color: #333;
      font-size: 15px;
      margin: 10px 0 20px;
      word-break: break-all;
    }

    .btn-group {
      margin: 10px 0 20px;
    }
    .view-btn {
      background: #7b3fe4;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      margin: 0 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    .view-btn:hover {
      background: #9b5ff5;
    }
  </style>
</head>
<body>
  <h1 id="folderTitle">📁 폴더</h1>
  <div class="btn-group">
    <button class="view-btn" id="threeCol">3열 보기</button>
    <button class="view-btn" id="oneCol">1열 보기</button>
  </div>
  <div class="info" id="infoText"></div>
  <div class="msg" id="msg"></div>
  <div class="gallery" id="gallery"></div>
  <a class="back" href="index.html">← 폴더 선택으로 돌아가기</a>

  <script>
    const params = new URLSearchParams(location.search);
    const folder = params.get("folder") || "A";
    const addTweet = params.get("add");
    const addImage = params.get("img");

    const folderKey = `folder_${folder}`;
    const gallery = document.getElementById("gallery");
    const msg = document.getElementById("msg");
    const title = document.getElementById("folderTitle");
    const info = document.getElementById("infoText");

    title.textContent = `📁 ${folder} 폴더`;

    let data = JSON.parse(localStorage.getItem(folderKey) || "[]");

    // ✅ 새 항목 추가
    if (addTweet && addImage) {
      const exists = data.some(item => item.tweet === addTweet);
      if (!exists) {
        data.push({ tweet: addTweet, image: addImage });
        localStorage.setItem(folderKey, JSON.stringify(data));
        msg.textContent = "✅ 새 이미지가 추가되었습니다!";
      } else {
        msg.textContent = "⚠️ 이미 존재하는 항목입니다.";
      }
    }

    data = JSON.parse(localStorage.getItem(folderKey) || "[]");

    function renderGallery() {
      info.textContent = `트윗 ${data.length}개`;
      if (data.length === 0) {
        gallery.innerHTML = `<p>📭 ${folder} 폴더에 이미지가 없습니다.</p>`;
        return;
      }

      gallery.innerHTML = "";
      data.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "thumb";

        const img = document.createElement("img");
        img.src = item.image;
        img.onerror = () => img.src = "https://cdn-icons-png.flaticon.com/512/463/463612.png";
        img.onclick = () => window.open(item.tweet, "_blank");

        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "🗑 삭제";
        del.onclick = (e) => {
          e.stopPropagation();
          if (confirm("정말 삭제하시겠어요?")) {
            data.splice(index, 1);
            localStorage.setItem(folderKey, JSON.stringify(data));
            renderGallery();
          }
        };

        div.appendChild(img);
        div.appendChild(del);
        gallery.appendChild(div);
      });
    }

    // ✅ 보기 전환 버튼
    document.getElementById("threeCol").onclick = () => {
      gallery.classList.remove("one-column");
    };
    document.getElementById("oneCol").onclick = () => {
      gallery.classList.add("one-column");
    };

    renderGallery();
  </script>
</body>
</html>
