<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📁 트윗 이미지 폴더</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      text-align: center;
      background: #f9f9f9;
      margin: 0;
    }
    h2 {
      margin-top: 20px;
    }
    #debug {
      font-size: 12px;
      color: #666;
      margin: 10px;
      padding: 10px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      padding: 15px;
    }
    .thumb {
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      transition: transform 0.2s ease;
    }
    .thumb:hover {
      transform: scale(1.05);
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    a {
      color: #6a0dad;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h2>📁 트윗 이미지 폴더</h2>
  <div id="debug"></div>
  <div id="gallery" class="gallery"></div>
  <p><a href="./index.html">← 폴더 선택으로 돌아가기</a></p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const folder = params.get("folder") || "A";
    const key = "folder_" + folder;
    const data = JSON.parse(localStorage.getItem(key) || "[]");

    document.querySelector("h2").innerText = `📁 폴더 ${folder}`;
    document.getElementById("debug").innerHTML = `<b>key:</b> ${key}<br><b>개수:</b> ${data.length}`;

    const gallery = document.getElementById("gallery");

    if (data.length === 0) {
      gallery.innerHTML = "<p>아직 저장된 트윗이 없습니다.</p>";
    } else {
      data.forEach(async (link) => {
        const div = document.createElement("div");
        div.className = "thumb";

        try {
          const embedURL = `https://publish.twitter.com/oembed?url=${encodeURIComponent(link)}&omit_script=true`;
          const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(embedURL)}`;
          const res = await fetch(proxy);
          const json = await res.json();
          const html = json.contents;

          // 이미지 URL 추출 (jpg, png, webp 등)
          const match = html.match(/https:\/\/pbs\.twimg\.com\/media\/[A-Za-z0-9_-]+\.(jpg|png|webp)/);
          const imgURL = match ? match[0] : "https://abs.twimg.com/icons/apple-touch-icon-192x192.png";

          div.innerHTML = `
            <a href="${link}" target="_blank">
              <img src="${imgURL}" alt="tweet image">
            </a>
          `;
        } catch (err) {
          console.error(err);
          div.innerHTML = `<a href="${link}" target="_blank">
            <img src="https://abs.twimg.com/icons/apple-touch-icon-192x192.png" alt="tweet">
          </a>`;
        }

        gallery.appendChild(div);
      });
    }
  </script>
</body>
</html>
