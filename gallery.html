<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>폴더 보기</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-4 bg-gray-100 text-gray-800">
  <a href="index.html" class="text-blue-600 underline">← 폴더 목록으로</a>
  <h1 id="folderTitle" class="text-xl font-bold mb-3"></h1>
  <div id="gallery" class="grid grid-cols-3 gap-2"></div>

  <script>
  const folder = new URLSearchParams(location.search).get("folder");
  document.getElementById("folderTitle").textContent = "📁 " + folder + " 폴더";

  const data = JSON.parse(localStorage.getItem("tweetAlbums")||"{}");
  const urls = data[folder] || [];

  async function getThumbnail(url){
    const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
    const html = await res.text();
    const match = html.match(/property="og:image" content="([^"]+)"/);
    return match ? match[1] : null;
  }

  (async()=>{
    const gallery=document.getElementById("gallery");
    for(const u of urls){
      const thumb=await getThumbnail(u);
      if(thumb){
        const a=document.createElement("a");
        a.href=u; a.target="_blank";
        const img=document.createElement("img");
        img.src=thumb; img.className="rounded-lg shadow";
        a.appendChild(img);
        gallery.appendChild(a);
      }
    }
  })();
  </script>
</body>
</html>
