<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clip 갤러리</title>
  <style>
    body {
      font-family: "Apple SD Gothic Neo", sans-serif;
      background: #fafafa;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { font-size: 22px; margin-bottom: 10px; color: #1d9bf0; }
    .msg {
      font-size: 14px;
      color: #666;
      margin: 10px 0 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 10px;
    }
    .thumb {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .thumb:hover { transform: scale(1.03); }
    .thumb img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
    }
    .back {
      display: block;
      margin-top: 20px;
      color: #555;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1 id="folderName">📂 Clip 갤러리</h1>
  <div id="msg" class="msg"></div>
  <div id="gallery" class="grid"></div>
  <a href="index.html" class="back">← 폴더 선택으로 돌아가기</a>

  <script>
    const params = new URLSearchParams(window.location.search);
    const folder = params.get("folder") || "A";
    const addTweet = params.get("add");
    const addImage = params.get("img");
    const key = `folder_${folder}`;

    const msg = document.getElementById("msg");
    const gallery = document.getElementById("gallery");
    document.getElementById("folderName").textContent = `${folder} 폴더`;

    // 1️⃣ 기존 데이터 불러오기
    let data = JSON.parse(localStorage.getItem(key) || "[]");

    // 2️⃣ 파라미터가 있으면 추가
    if (addTweet && addImage) {
      const exists = data.some(item => item.tweet === addTweet);
      if (!exists) {
        data.push({ tweet: addTweet, image: addImage });
        localStorage.setItem(key, JSON.stringify(data));
        msg.textContent = "✅ 새 트윗이 추가되었습니다!";
      } else {
        msg.textContent = "⚠️ 이미 존재하는 트윗입니다.";
      }
    }

    // 3️⃣ 갤러리 표시
    if (data.length === 0) {
      gallery.innerHTML = `<p>📭 ${folder} 폴더에 이미지가 없습니다.</p>`;
    } else {
      gallery.innerHTML = "";
      data.forEach(item => {
        const div = document.createElement("div");
        div.className = "thumb";

        const img = document.createElement("img");
        img.src = item.image || "https://via.placeholder.com/150?text=No+Image";
        img.onerror = () => img.src = "https://via.placeholder.com/150?text=Error";

        div.onclick = () => window.open(item.tweet, "_blank");

        div.appendChild(img);
        gallery.appendChild(div);
      });
    }
  </script>
</body>
</html>
