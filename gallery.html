<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clip Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 10px;
      background: #fafafa;
    }

    h2 {
      text-align: center;
    }

    /* ✨ 버튼 스타일 */
    .toolbar {
      text-align: center;
      margin-bottom: 15px;
    }
    .toolbar button {
      background: #007bff;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin: 0 5px;
    }
    .toolbar button.active {
      background: #0056b3;
    }

    /* 🔹 기본 3열 갤러리 */
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    /* ✨ 1열 모드용 클래스 */
    .single-column {
      grid-template-columns: 1fr !important;
    }

    .gallery img {
      width: 100%;
      border-radius: 8px;
      transition: transform 0.2s;
      cursor: pointer;
    }

    .gallery img:hover {
      transform: scale(1.02);
    }
  </style>
</head>
<body>
  <h2 id="folderTitle">폴더</h2>

  <!-- ✨ 보기 전환 버튼 -->
  <div class="toolbar">
    <button id="gridView" class="active">3열 보기</button>
    <button id="listView">1열 보기</button>
  </div>

  <div class="gallery" id="gallery"></div>

  <script>
    // 폴더명 추출
    const urlParams = new URLSearchParams(window.location.search);
    const folder = urlParams.get("folder");
    document.getElementById("folderTitle").textContent = folder + " 폴더";

    const gallery = document.getElementById("gallery");

    // 저장된 데이터 불러오기
    const key = "folder_" + folder;
    const items = JSON.parse(localStorage.getItem(key) || "[]");

    // 이미지 표시
    items.forEach(item => {
      const img = document.createElement("img");
      img.src = item.img;
      img.onclick = () => window.open(item.link, "_blank");
      gallery.appendChild(img);
    });

    // ✨ 버튼으로 정렬 전환
    const gridBtn = document.getElementById("gridView");
    const listBtn = document.getElementById("listView");

    gridBtn.addEventListener("click", () => {
      gallery.classList.remove("single-column");
      gridBtn.classList.add("active");
      listBtn.classList.remove("active");
    });

    listBtn.addEventListener("click", () => {
      gallery.classList.add("single-column");
      listBtn.classList.add("active");
      gridBtn.classList.remove("active");
    });
  </script>
</body>
</html>
