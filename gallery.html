<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>트윗 갤러리</title>
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; text-align: center; background: #fafafa; margin: 0; padding: 20px; }
    h2 { font-size: 22px; margin-bottom: 10px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; justify-items: center; }
    .tweet-img {
      width: 100px; height: 100px; object-fit: cover;
      border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.2s; cursor: pointer;
    }
    .tweet-img:hover { transform: scale(1.05); }
    .fallback {
      width: 100px; height: 100px; display: flex; align-items: center; justify-content: center;
      border-radius: 12px; background: #e0e0e0; color: #777; font-size: 32px;
    }
    a { text-decoration: none; color: inherit; }
  </style>
</head>
<body>
  <h2>📁 <span id="folderName"></span> 폴더</h2>
  <p id="countInfo"></p>
  <div id="gallery" class="grid"></div>
  <p><a href="index.html">← 폴더 선택으로 돌아가기</a></p>

  <script>
    const params = new URLSearchParams(location.search);
    const folder = params.get('folder');
    document.getElementById('folderName').textContent = folder;
    const key = 'folder_' + folder;
    const tweets = JSON.parse(localStorage.getItem(key) || '[]');
    document.getElementById('countInfo').textContent = `트윗 ${tweets.length}개`;

    const gallery = document.getElementById('gallery');

    async function loadPreview(url) {
      try {
        const api = `https://publish.twitter.com/oembed?url=${encodeURIComponent(url)}&omit_script=true`;
        const res = await fetch(api);
        const data = await res.json();

        // oEmbed 데이터 안에는 HTML이 포함됨 — <img> 태그 추출
        const match = data.html.match(/<img[^>]+src="([^"]+)"/);
        const imgUrl = match ? match[1] : null;

        const img = document.createElement('img');
        img.className = 'tweet-img';
        img.src = imgUrl || 'https://abs.twimg.com/icons/apple-touch-icon-192x192.png';
        img.alt = '트윗 이미지';
        img.onclick = () => window.open(url, '_blank');
        gallery.appendChild(img);
      } catch (e) {
        const fallback = document.createElement('div');
        fallback.className = 'fallback';
        fallback.textContent = '🚫';
        gallery.appendChild(fallback);
      }
    }

    if (tweets.length === 0) {
      gallery.innerHTML = '<p>아직 저장된 트윗이 없습니다.</p>';
    } else {
      tweets.forEach(loadPreview);
    }
  </script>
</body>
</html>
