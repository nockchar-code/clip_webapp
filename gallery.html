<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clip 갤러리</title>
  <style>
    body {
      font-family: "Apple SD Gothic Neo", sans-serif;
      background: #fafafa;
      text-align: center;
      margin: 0;
      padding: 30px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 10px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 15px;
      padding: 20px;
    }
    .thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .fallback {
      font-size: 40px;
      color: #e53935;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    .back {
      display: block;
      margin-top: 20px;
      color: #7e57c2;
    }
  </style>
</head>
<body>
  <h1>📁 <span id="folderName"></span> 폴더</h1>
  <p id="countInfo"></p>
  <div id="gallery" class="grid"></div>
  <a href="index.html" class="back">← 폴더 선택으로 돌아가기</a>

  <script>
    async function loadGallery() {
      const urlParams = new URLSearchParams(window.location.search);
      const folder = urlParams.get("folder");
      document.getElementById("folderName").textContent = folder;
      
      const key = `folder_${folder}`;
      const data = JSON.parse(localStorage.getItem(key) || "[]");
      document.getElementById("countInfo").textContent = `트윗 ${data.length}개`;

      const gallery = document.getElementById("gallery");
      gallery.innerHTML = "";

      for (const url of data) {
        const normalized = url.replace("https://x.com/", "https://twitter.com/");
        const div = document.createElement("div");
        div.className = "thumb";

        try {
          const res = await fetch(normalized, { mode: "cors" });
          const html = await res.text();
          const metaMatch = html.match(/<meta property="og:image" content="(.*?)"/);
          if (metaMatch && metaMatch[1]) {
            const imgEl = document.createElement("img");
            imgEl.src = metaMatch[1];
            const linkEl = document.createElement("a");
            linkEl.href = normalized;
            linkEl.target = "_blank";
            linkEl.appendChild(imgEl);
            div.appendChild(linkEl);
          } else {
            div.innerHTML = '<div class="fallback">❌</div>';
          }
        } catch (err) {
          div.innerHTML = '<div class="fallback">🚫</div>';
        }

        gallery.appendChild(div);
      }
    }

    loadGallery();
  </script>
</body>
</html>
