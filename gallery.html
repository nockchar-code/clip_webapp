<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📁 트윗 폴더</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      text-align: center;
      background-color: #f9f9f9;
      margin: 0;
    }
    h2 {
      margin-top: 20px;
    }
    #debug {
      font-size: 12px;
      color: #666;
      background: #fff;
      border-radius: 10px;
      margin: 10px;
      padding: 10px;
      box-shadow: 0 0 4px rgba(0,0,0,0.1);
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 15px;
      padding: 20px;
    }
    .tweet-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 0 6px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.2s;
      padding: 5px;
    }
    .tweet-card:hover {
      transform: translateY(-3px);
    }
  </style>
</head>
<body>
  <h2>📁 트윗 폴더</h2>
  <div id="debug"></div>
  <div id="gallery" class="gallery"></div>
  <p><a href="./index.html">← 폴더 선택으로 돌아가기</a></p>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const folder = urlParams.get("folder") || "A";
    const key = "folder_" + folder;
    const data = JSON.parse(localStorage.getItem(key) || "[]");

    document.querySelector("h2").innerText = `📁 폴더 ${folder}`;
    document.getElementById("debug").innerHTML = `
      <b>key:</b> ${key}<br>
      <b>data:</b> ${JSON.stringify(data)}
    `;

    const gallery = document.getElementById("gallery");

    if (data.length === 0) {
      gallery.innerHTML = "<p>아직 저장된 트윗이 없습니다.</p>";
    } else {
      data.forEach(async (link) => {
        const div = document.createElement("div");
        div.className = "tweet-card";

        try {
          const embedURL = `https://publish.twitter.com/oembed?url=${encodeURIComponent(link)}&omit_script=true&align=center`;
          const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(embedURL)}`;
          const res = await fetch(proxy);
          const json = await res.json();
          const html = JSON.parse(JSON.stringify(json)).contents;

          div.innerHTML = html;
        } catch (err) {
          console.error(err);
          div.innerHTML = `<a href="${link}" target="_blank">${link}</a>`;
        }

        gallery.appendChild(div);
      });
    }
  </script>
</body>
</html>
